name: Refresh online earning opportunities

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-opportunities
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run opportunity lifecycle maintenance
        run: node scripts/fetch-opportunities.mjs
      - name: Commit data only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json data/opportunities-archive.json
          if git diff --cached --quiet; then
            echo "No lifecycle changes; skipping site deployment."
          else
            git commit -m "chore: refresh online opportunity catalog"
            git push
          fi
